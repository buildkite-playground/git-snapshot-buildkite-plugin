<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" role="img" aria-labelledby="title desc">
  <title id="title">Linux checkout: Git-native options and warm Git-snapshot</title>
  <desc id="desc">Linux kernel on hosted-large agents, mirrors off. Native bars are per-job run times from one production build, excluding queue wait: full clone with agent defaults 247 seconds, blobless 254 seconds, treeless 210 seconds, shallow depth one 205 seconds. Git-snapshot is a separate controlled checkout median of 9.98 seconds across 16 warm snapshot and patch hits, displayed as approximately 10 seconds. All except agent defaults use eight checkout workers. Native job run times and controlled checkout times have different timing scopes; this is not a matched speedup measurement. Seeding and saves are excluded from the snapshot median. Bars share a linear scale starting at zero, two pixels per second. Sources and limitations: benchmarks/linux-demo.md.</desc>
  <style>
    svg { --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --context: #8c959f; --accent: #0969da; --rule: #d1d9e0; background: var(--bg); }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: var(--fg); font-variant-numeric: tabular-nums; }
    .muted { fill: var(--muted); }
    .context { fill: var(--context); }
    .accent { fill: var(--accent); }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #0d1117; --fg: #f0f6fc; --muted: #b1bac4; --context: #9198a1; --accent: #58a6ff; --rule: #3d444d; }
    }
  </style>
  <rect width="640" height="410" fill="var(--bg)"/>
  <text x="24" y="36" font-size="24" font-weight="500">Linux checkout comparison</text>
  <text x="24" y="63" font-size="16" class="muted">Linux kernel · hosted-large · mirrors off</text>

  <text x="24" y="102" font-size="18">Full clone</text>
  <text x="616" y="102" font-size="18" text-anchor="end">4m 7s</text>
  <rect x="24" y="112" width="494" height="16" class="context"/>

  <text x="24" y="156" font-size="18">Blobless</text>
  <text x="616" y="156" font-size="18" text-anchor="end">4m 14s</text>
  <rect x="24" y="166" width="508" height="16" class="context"/>

  <text x="24" y="210" font-size="18">Treeless</text>
  <text x="616" y="210" font-size="18" text-anchor="end">3m 30s</text>
  <rect x="24" y="220" width="420" height="16" class="context"/>

  <text x="24" y="264" font-size="18">Shallow (depth 1)</text>
  <text x="616" y="264" font-size="18" text-anchor="end">3m 25s</text>
  <rect x="24" y="274" width="410" height="16" class="context"/>

  <text x="24" y="318" font-size="18" font-weight="500">Git-snapshot</text>
  <text x="616" y="318" font-size="18" font-weight="500" text-anchor="end">~10s</text>
  <rect x="24" y="328" width="19.96" height="16" class="accent"/>

  <line x1="24" y1="368" x2="616" y2="368" stroke="var(--rule)"/>
  <text x="24" y="395" font-size="16" class="muted">Native: job run time; Git-snapshot: median checkout (n=16).</text>
</svg>
