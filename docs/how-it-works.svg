<svg xmlns="http://www.w3.org/2000/svg" width="960" height="690" viewBox="0 0 960 690" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'DejaVu Sans', sans-serif">
<title id="title">How git-snapshot works</title>
<desc id="desc">Buildkite Cache holds two entries: a big snapshot of the .git directory, saved about once a day (max-age), and a small per-commit patch from the snapshot to the build commit, saved once per new commit by its first job. Every job runs three steps. The plugin's pre-checkout hook restores the snapshot, looks up the patch for the commit and, on a hit, applies it and sets skip-fetch. The agent's checkout then skips its fetch on a hit (only its branch check reaches upstream), or fetches the commit on a miss, and checks out. The plugin's post-checkout hook saves the patch after a miss, and saves a new snapshot once the old one is older than max-age.</desc>
<defs><marker id="arrow-idle" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arrow-on" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f9fafb"/></marker></defs>
<rect x="1" y="1" width="958" height="688" rx="16" fill="#111827" stroke="#374151" stroke-width="2"/>
<text x="32" y="52" font-size="28" fill="#f9fafb" font-weight="700">How git-snapshot works</text>
<text x="32" y="82" font-size="16" fill="#d1d5db">Two Buildkite Cache entries let most jobs check out without fetching from upstream.</text>
