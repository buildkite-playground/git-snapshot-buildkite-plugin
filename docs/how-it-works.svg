<circle cx="816" cy="46" r="12" fill="#22d3ee" opacity="0"><animate attributeName="opacity" dur="24s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3333;0.35;0.4833;0.5;1" values="0;0;1;1;0;0"/></circle>
