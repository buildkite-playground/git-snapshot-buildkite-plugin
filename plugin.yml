name: Git Snapshot
description: Restore a blobless Git snapshot from Buildkite Cache while keeping agent-owned checkout
author: https://github.com/buildkite-playground
requirements:
  - bash
  - git
  - buildkite-agent
configuration:
  properties:
    checkout-workers:
      type: integer
      minimum: 1
      default: 8
    max-age:
      type: integer
      minimum: 1
      maximum: 86400
      default: 86400
      description: Snapshot refresh age and immutable key period, in seconds (at most one day)
    refresh:
      type: boolean
      default: true
    refresh-only:
      type: boolean
      default: false
      description: Scheduled refresh job; the agent still checks out normally, pair with command ':'
    key-prefix:
      type: string
      minLength: 1
      default: git-snapshot-v2
  additionalProperties: false
