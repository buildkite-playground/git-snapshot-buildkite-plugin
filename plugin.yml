name: Git Snapshot
description: Restore a treeless Git snapshot and per-commit patches from Buildkite Cache before the agent's checkout
author: https://github.com/buildkite-playground
requirements:
  - bash
  - git
  - buildkite-agent
configuration:
  properties:
    treeless:
      type: boolean
      default: true
      description: Use tree:0; set false for blob:none when jobs use path history
    checkout-workers:
      type: integer
      minimum: 1
      default: 8
    max-age:
      type: integer
      minimum: 1
      maximum: 86400
      default: 86400
      description: Snapshot refresh age and immutable key period, in seconds (at most one day)
    refresh:
      type: boolean
      default: true
    patches:
      type: boolean
      default: true
      description: Cache per-commit patches from the snapshot so later jobs skip upstream fetches
    refresh-only:
      type: boolean
      default: false
      description: Scheduled refresh job; saves whenever the snapshot is from an earlier key period; pair with command ':'
    key-prefix:
      type: string
      minLength: 1
      default: git-snapshot-v3
  additionalProperties: false
