name: Git Snapshot
description: Restore a treeless Git snapshot from Buildkite Cache and check out with parallel workers
author: https://github.com/buildkite-playground
requirements:
  - bash
  - git
  - buildkite-agent
configuration:
  properties:
    mode:
      type: string
      enum: [checkout, agent]
      default: agent
      description: Agent mode skips snapshots when mirrors are enabled; checkout is explicit opt-in
    treeless:
      type: boolean
      default: true
      description: Use tree:0; set false for blob:none when jobs use path history
    checkout-workers:
      type: integer
      minimum: 1
      default: 8
    max-age:
      type: integer
      minimum: 1
      maximum: 86400
      default: 86400
      description: Snapshot refresh age and immutable key period, in seconds (at most one day)
    refresh:
      type: boolean
      default: true
    refresh-only:
      type: boolean
      default: false
      description: Refresh job; checkout mode installs no worktree; pair with command ':'
    key-prefix:
      type: string
      minLength: 1
      default: git-snapshot-v3
  additionalProperties: false
